<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title">
  <title id="title">Invocation — glyphe géométrique</title>
  <!-- Quatre branches pleines, arrêtées au bord du cercle -->
  <g fill="currentColor">
    <path id="branch" d="M 37.4,15.2 H 62.6 V 17.2 C 55.2,18.8 54.6,24.8 54.6,32.16 H 45.4 C 45.4,24.8 44.8,18.8 37.4,17.2 Z"/>
    <use href="#branch" transform="rotate(90 50 50)"/>
    <use href="#branch" transform="rotate(180 50 50)"/>
    <use href="#branch" transform="rotate(270 50 50)"/>
  </g>
  <!-- Cercle central, sans remplissage -->
  <circle cx="50" cy="50" r="18.4" fill="none" stroke="currentColor" stroke-width="1.65" />
  <!-- Traits diagonaux et pointes ouvertes en angle droit -->
  <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="square" stroke-linejoin="miter">
    <path id="ray" d="M 36.99,36.99 L 16.8,16.8 M 16.8,25.6 V 16.8 H 25.6" />
    <use href="#ray" transform="rotate(90 50 50)" />
    <use href="#ray" transform="rotate(180 50 50)" />
    <use href="#ray" transform="rotate(270 50 50)" />
  </g>
</svg>